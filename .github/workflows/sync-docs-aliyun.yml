# 将仓库 Docs/ 同步到阿里云持久目录（不在站点清空范围内）
name: 同步 Docs 到阿里云

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Docs/**"
      - ".github/workflows/sync-docs-aliyun.yml"

concurrency:
  group: sync-docs-aliyun
  cancel-in-progress: true

jobs:
  sync:
    name: 上传 Docs
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查阿里云 Secrets
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          missing=0
          for k in ALIYUN_HOST ALIYUN_USERNAME ALIYUN_PASSWORD; do
            if [ -z "${!k}" ]; then
              echo "::error::缺少仓库 Secret: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ ! -d Docs ]; then
            echo "::error::仓库根目录没有 Docs/"
            exit 1
          fi

      - name: 确保远端目录存在
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            powershell -NoProfile -Command "$p='D:/IIS/Astrox.Blog.Docs'; if (Test-Path $p) { Get-ChildItem -Force $p | Remove-Item -Recurse -Force }; New-Item -ItemType Directory -Path $p -Force | Out-Null"

      - name: 上传 Docs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          port: 22
          source: "Docs/*"
          target: "D:/IIS/Astrox.Blog.Docs"
          strip_components: 1
          tar_dereference: true
