<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cesium demo 测试</title>
  <link rel="stylesheet" href="https://registry.npmmirror.com/cesium/1.145.0/files/Build/Cesium/Widgets/widgets.css" />
  <script src="https://registry.npmmirror.com/cesium/1.145.0/files/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // 不使用 Cesium Ion：关闭默认 Ion 影像/地形，地形用椭球 EllipsoidTerrainProvider。
    // 底图两层：
    //   1) 底层保底：Cesium 自带的 NaturalEarthII 离线影像（随 Cesium CDN 一起加载，分辨率低但总能显示）；
    //   2) 上层主底图：高德卫星影像（国内访问快、免 token、返回 CORS 头）。
    // 主底图瓦片连续失败时自动移除上层，回退到 NaturalEarthII。
    // 注：高德瓦片在国内为 GCJ-02 坐标，与 WGS84 有数百米偏移，演示尺度下可忽略。
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"))
      ),
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: true,
      infoBox: true,
      selectionIndicator: true
    });

    const primary = new Cesium.UrlTemplateImageryProvider({
      url: "https://wprd0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",
      subdomains: ["1", "2", "3", "4"],
      minimumLevel: 1,
      maximumLevel: 18,
      credit: "高德地图"
    });
    const primaryLayer = viewer.imageryLayers.addImageryProvider(primary);

    let failed = 0;
    const MAX_FAILURES = 6;
    primary.errorEvent.addEventListener(function (err) {
      err.retry = false;
      failed++;
      if (failed === MAX_FAILURES && viewer.imageryLayers.contains(primaryLayer)) {
        viewer.imageryLayers.remove(primaryLayer, true);
        console.warn("主底图（高德影像）加载失败，已回退到 NaturalEarthII 离线底图");
      }
    });

    viewer.scene.globe.enableLighting = false;

    // 示例点：上海
    const shanghai = viewer.entities.add({
      name: "上海",
      position: Cesium.Cartesian3.fromDegrees(121.4737, 31.2304),
      point: { pixelSize: 12, color: Cesium.Color.CYAN, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
      label: {
        text: "上海",
        font: "16px sans-serif",
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -20)
      },
      description: "示例点：上海（121.4737°E, 31.2304°N）"
    });

    // 先显示整个地球，再飞到上海
    setTimeout(function () {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(121.4737, 31.2304, 1500000),
        duration: 3
      });
    }, 1500);
  </script>
</body>
</html>
